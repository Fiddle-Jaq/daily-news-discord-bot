# Feeds and tuning values (SPEC §4.2). Checked with `daily-news --check-feeds`.

[selection]
japan_max = 7
world_max = 4
window_hours = 30          # normal time window
max_window_hours = 48      # upper bound when the last post is older
max_candidates = 120       # candidates passed to the LLM
per_feed_max = 20          # newest N articles taken from each feed
stale_feed_hours = 72      # a feed whose newest article is older than this is "dead"
description_max_chars = 200

[filters]
exclude_url_patterns = ["/sport", "/sports/", "/entertainment", "/culture/", "/lifestyle"]

# --- Japan (primary: NHK) ---

[[feeds]]
name = "NHK 主要"
url = "https://news.web.nhk/n-data/conf/na/rss/cat0.xml"
lang = "ja"
source = "NHK"
fallback_region = "japan"   # slot used by the no-LLM fallback
fallback_priority = 1       # lower wins; unset means never used for the fallback

